<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - ScreenTime Hub</title>
    <link rel="icon" type="image/png" href="assets/screentime-mark.png">
    
    <!-- Bootstrap 5 styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20261108-2">
</head>
<body class="app-page app-shell">
    <div class="app-shell-layout">
        <aside class="workspace-sidebar" aria-label="Main navigation">
            <a class="workspace-logo" href="dashboard.html" aria-label="ScreenTime Hub dashboard"><img src="assets/screentime-mark.png" width="26" height="26" alt=""></a>
            <button class="workspace-sidebar-toggle" type="button" data-sidebar-toggle aria-expanded="true" aria-label="Collapse navigation"><span aria-hidden="true">☰</span></button>
            <nav class="workspace-nav">
                <a class="workspace-nav-link" href="dashboard.html"><span aria-hidden="true">⌂</span>Home</a>
                <a class="workspace-nav-link" href="frequently.html"><span aria-hidden="true">◷</span>Analytics</a>
                <a class="workspace-nav-link" href="draft.html"><span aria-hidden="true">▤</span>Drafts</a>
                <a class="workspace-nav-link active" href="profile.html" aria-current="page"><span aria-hidden="true">♙</span>Profile</a>
                <a class="workspace-nav-link" href="setting.html"><span aria-hidden="true">⚙</span>Settings</a>
            </nav>
            <button class="workspace-theme-toggle" type="button" data-theme-toggle aria-pressed="false">
                <span aria-hidden="true">☾</span><span class="theme-toggle-label">Dark mode</span>
            </button>
            <a class="workspace-signout" href="index.html"><span aria-hidden="true">↪</span>Sign out</a>
        </aside>
        <main class="app-shell-main">
            <header class="workspace-topbar"><span class="workspace-breadcrumb">ScreenTime Hub <span aria-hidden="true">/</span> Profile</span><span class="workspace-user"><span class="workspace-user-avatar">A</span> Auzaie</span></header>

    <!-- Profile content -->
    <div class="container my-4 flex-grow-1 app-shell-content">
        <h3 class="fw-bold mb-4">User Profile</h3>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card border-0 shadow-sm p-4 text-center bg-white">
                    <div class="mb-3">
                        <div id="profileInitials" class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center fw-bold fs-1" style="width: 90px; height: 90px;">
                            AR
                        </div>
                    </div>
                    <h5 id="profileDisplayName" class="fw-bold mb-1">Auzaie Rusydi</h5>
                    <p id="profileDisplayEmail" class="text-muted small">auzaie.rusydi2004@gmail.com</p>
                    <span class="badge bg-success mx-auto">Active Status</span>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="card border-0 shadow-sm p-4 bg-white">
                    <h5 class="fw-bold mb-3">Account Information</h5>
                    <div id="profileFeedback" class="alert d-none" role="status" aria-live="polite"></div>
                    <form id="profileForm">
                        <div class="mb-3">
                            <label for="profileName" class="form-label text-muted small fw-bold">Full Name</label>
                            <input id="profileName" type="text" class="form-control" value="Auzaie Rusydi bin Abdul Rahman" maxlength="100" required>
                        </div>
                        <div class="mb-3">
                            <label for="profileEmail" class="form-label text-muted small fw-bold">Email Address</label>
                            <input id="profileEmail" type="email" class="form-control" value="auzaie.rusydi2004@gmail.com" maxlength="254" required>
                        </div>
                        <div class="mb-3">
                            <label for="profileRole" class="form-label text-muted small fw-bold">Role / Group</label>
                            <input id="profileRole" type="text" class="form-control" value="IMS566 Student - Individual Project" maxlength="100" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="app-footer border-top text-center py-3 mt-auto">
        <small class="text-muted">&copy; 2026 IMS566 Individual Project. Prepared by Auzaie.</small>
    </footer>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
