<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ScreenTime Hub</title>
    <link rel="icon" type="image/png" href="assets/screentime-mark.png">
    
    <!-- Bootstrap 5 styles -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom styles -->
    <link rel="stylesheet" href="css/style.css?v=20261111-1">
</head>
<body class="login-page d-flex align-items-center justify-content-center">

    <div class="card login-card">
        <div class="text-center mb-4">
            <img class="login-logo mb-2" src="assets/screentime-mark.png" alt="ScreenTime Hub hourglass logo">
            <h3 class="fw-bold text-primary">ScreenTime Hub</h3>
            <p class="text-muted">Daily Activity & Time Management</p>
        </div>

        <div id="auth-alert" class="alert d-none" role="status" aria-live="polite"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="auzaie.rusydi2004@gmail.com" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
            
            <div class="mb-3 text-end">
                <small class="text-muted">Demo credentials: <b>auzaie.rusydi2004@gmail.com / 12345</b></small>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Sign In</button>
            <p class="login-switch text-center mb-0 mt-3">
                Don't have an account?
                <button type="button" class="btn btn-link p-0 align-baseline" id="showSignup">Sign up</button>
            </p>
        </form>

        <form id="signupForm" class="d-none">
            <div class="mb-3">
                <label for="signupName" class="form-label">Full name</label>
                <input type="text" class="form-control" id="signupName" maxlength="100" autocomplete="name" required>
            </div>
            <div class="mb-3">
                <label for="signupEmail" class="form-label">Email address</label>
                <input type="email" class="form-control" id="signupEmail" maxlength="254" autocomplete="email" required>
            </div>
            <div class="mb-3">
                <label for="signupPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="signupPassword" minlength="8" autocomplete="new-password" aria-describedby="passwordHelp" required>
                <small id="passwordHelp" class="form-text text-muted">Use at least 8 characters.</small>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm password</label>
                <input type="password" class="form-control" id="confirmPassword" minlength="8" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Create Account</button>
            <p class="login-switch text-center mb-0 mt-3">
                Already have an account?
                <button type="button" class="btn btn-link p-0 align-baseline" id="showLogin">Sign in</button>
            </p>
        </form>
        <small class="login-note text-center mt-3">Accounts are saved in this browser only.</small>
    </div>

    <script>
        (function () {
            const accountsKey = 'screentimehub.accounts';
            const demoEmail = 'auzaie.rusydi2004@gmail.com';
            const demoPassword = '12345';
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const alertBox = document.getElementById('auth-alert');

            function showMessage(message, isError) {
                alertBox.textContent = message;
                alertBox.className = `alert ${isError ? 'alert-danger' : 'alert-success'}`;
                alertBox.setAttribute('role', isError ? 'alert' : 'status');
            }

            function clearMessage() {
                alertBox.textContent = '';
                alertBox.className = 'alert d-none';
            }

            function readAccounts() {
                const savedAccounts = localStorage.getItem(accountsKey);
                const accounts = savedAccounts === null ? [] : JSON.parse(savedAccounts);
                if (!Array.isArray(accounts)) {
                    throw new Error('Saved account data is invalid.');
                }
                return accounts;
            }

            function createSalt() {
                const salt = new Uint8Array(16);
                window.crypto.getRandomValues(salt);
                return Array.from(salt, byte => byte.toString(16).padStart(2, '0')).join('');
            }

            async function hashPassword(password, salt) {
                const encoder = new TextEncoder();
                const key = await window.crypto.subtle.importKey(
                    'raw',
                    encoder.encode(password),
                    'PBKDF2',
                    false,
                    ['deriveBits']
                );
                const bits = await window.crypto.subtle.deriveBits({
                    name: 'PBKDF2',
                    salt: encoder.encode(salt),
                    iterations: 120000,
                    hash: 'SHA-256'
                }, key, 256);
                return Array.from(new Uint8Array(bits), byte => byte.toString(16).padStart(2, '0')).join('');
            }

            function startSession(email, name) {
                localStorage.setItem('screentimehub.session', JSON.stringify({ email: email, name: name || '' }));
                window.location.href = 'dashboard.html';
            }

            function showForm(formToShow, formToHide) {
                clearMessage();
                formToHide.classList.add('d-none');
                formToShow.classList.remove('d-none');
            }

            document.getElementById('showSignup').addEventListener('click', function () {
                showForm(signupForm, loginForm);
            });
            document.getElementById('showLogin').addEventListener('click', function () {
                showForm(loginForm, signupForm);
            });

            loginForm.addEventListener('input', clearMessage);
            signupForm.addEventListener('input', clearMessage);

            loginForm.addEventListener('submit', async function (event) {
                event.preventDefault();
                if (!loginForm.reportValidity()) return;

                const email = document.getElementById('email').value.trim().toLowerCase();
                const password = document.getElementById('password').value;
                try {
                    if (email === demoEmail && password === demoPassword) {
                        startSession(email, 'Auzaie Rusydi');
                        return;
                    }

                    const account = readAccounts().find(savedAccount => savedAccount.email === email);
                    if (account && await hashPassword(password, account.salt) === account.passwordHash) {
                        startSession(email, account.name);
                        return;
                    }
                    showMessage('Invalid email or password. Please try again.', true);
                } catch (error) {
                    console.error('Could not sign in.', error);
                    showMessage('Could not sign in. Check browser storage and try again.', true);
                }
            });

            signupForm.addEventListener('submit', async function (event) {
                event.preventDefault();
                if (!signupForm.reportValidity()) return;

                const name = document.getElementById('signupName').value.trim();
                const email = document.getElementById('signupEmail').value.trim().toLowerCase();
                const password = document.getElementById('signupPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (!name) {
                    showMessage('Enter your name to create an account.', true);
                    document.getElementById('signupName').focus();
                    return;
                }
                if (password !== confirmPassword) {
                    showMessage('The passwords do not match.', true);
                    document.getElementById('confirmPassword').focus();
                    return;
                }
                if (!window.crypto || !window.crypto.subtle) {
                    showMessage('Secure sign-up is unavailable in this browser. Open the site using HTTPS or localhost.', true);
                    return;
                }

                try {
                    const accounts = readAccounts();
                    if (email === demoEmail || accounts.some(account => account.email === email)) {
                        showMessage('An account with this email already exists. Please sign in instead.', true);
                        return;
                    }

                    const salt = createSalt();
                    accounts.push({
                        name: name,
                        email: email,
                        salt: salt,
                        passwordHash: await hashPassword(password, salt)
                    });
                    localStorage.setItem(accountsKey, JSON.stringify(accounts));
                    startSession(email, name);
                } catch (error) {
                    console.error('Could not create an account.', error);
                    showMessage('Could not create your account. Check browser storage and try again.', true);
                }
            });
        })();
    </script>
</body>
</html>
